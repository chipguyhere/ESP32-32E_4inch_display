sentence=ST7796 display + XPT2046 touch driver for the ESP32-32E 4.0" touch LCD
paragraph=Self-contained display and resistive-touch driver for the generic ESP32 4.0" touch LCD whose PCB reads "ESP32-32E 320x480" (sold by several vendors). Drives the ST7796 320x480 SPI panel via the ESP-IDF SPI master driver with double-buffered DMA, and reads the XPT2046 resistive touch controller, which shares the display's SPI bus as a second device. Ships LVGL 9.3 examples (a hand-written Claude Code stub and a SquareLine Studio launcher) with display, touch, and LVGL plumbing already wired up.
